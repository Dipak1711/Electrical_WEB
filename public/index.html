<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a3201f">
  <title>Gurukrupa Electrical & Services</title>
  <meta name="description" content="Browse electrical products and prices at Gurukrupa Electrical & Services, and prepare your order list as a PDF.">
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <img class="logo" src="/logo.png" alt="Gurukrupa Electrical - Sales & Service">
      <span class="sp"></span>
      <button class="icon-btn" id="adminBtn" aria-label="Admin login" title="Admin"></button>
    </div>
  </header>

  <main class="wrap">
    <div class="searchbar">
      <span id="searchIcon"></span>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="Search product, brand, type…" aria-label="Search products">
      <button class="clear" id="clearQ" aria-label="Clear search" hidden></button>
    </div>
    <div class="chips" id="cats" role="tablist" aria-label="Categories"></div>
    <div class="chips sub" id="subs" hidden></div>
    <div class="count" id="count" aria-live="polite"></div>
    <div class="grid" id="grid"></div>
    <button class="btn more" id="more" hidden>Show more</button>
    <p class="note" style="text-align:center;margin-top:24px">Prices are indicative and may change. Your cart is only a quotation / order list - nothing is booked until you confirm with the shop.</p>
  </main>

  <div class="cartbar" id="cartbar" hidden>
    <button id="openCart"><span class="l" id="cartIcon"></span><span id="cartLabel"></span><span id="cartTotal"></span></button>
  </div>

  <div id="printArea"></div>

  <script src="/vendor/jspdf.umd.min.js"></script>
  <script src="/vendor/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="/js/shop.js"></script>
</body>
</html>
